[package]
name = "kya-examples"
description = "Runnable examples for the FintechBear KYA SDK. Not published; library crates never depend on this."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kya-core = { path = "../crates/kya-core", version = "0.1.0" }
kya-client = { path = "../crates/kya-client", version = "0.1.0" }
kya-crypto = { path = "../crates/kya-crypto", version = "0.1.0" }
# The curated public facade (FEAT-004). Examples 1-9 consume ONLY this surface,
# demonstrating the external-consumer entry point.
kya-sdk = { path = "../crates/kya-sdk", version = "0.1.0" }
# The experimental AP2 adapter. Deliberately NOT part of the facade, so example
# 10 depends on it directly to show its honestly-documented functionality.
kya-adapter-ap2 = { path = "../crates/kya-adapter-ap2", version = "0.1.0" }

[dev-dependencies]
# Example-only: used to produce a genuine Ed25519 signature so the demos route
# through the real kya-crypto engine rather than a stand-in verifier. Pinned to
# match kya-crypto's dependency. Not a library dependency. Available to
# [[example]] targets of this crate.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }

[[example]]
name = "offline_evaluation"
path = "offline_evaluation.rs"

